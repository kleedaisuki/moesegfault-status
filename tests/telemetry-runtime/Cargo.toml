# 测试专属驱动，不部署。 / Test-only driver, never deployed.
[package]
name = "status-telemetry-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
status-backend = { path = "../../crates/status-backend" }
worker = { version = "=0.8.5", features = ["queue"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
