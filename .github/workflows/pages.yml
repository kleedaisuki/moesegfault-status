name: Deploy operations UI to GitHub Pages

# 不从 push 自动发布：在 Access、域名和 API 完整核验前必须由审批者显式触发。
# Never publish on push: an approver must explicitly dispatch after Access, domain, and API verification.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 已审核的分支、tag 或 commit / Reviewed branch, tag, or commit
        required: true
        default: main
        type: string

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the explicitly selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Test and build operations UI
        run: |
          pnpm --filter @moesegfault/ops test
          pnpm --filter @moesegfault/ops build
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/ops/dist

  deploy:
    name: Deploy after environment approval
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
