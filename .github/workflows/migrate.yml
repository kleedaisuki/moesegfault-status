name: Migrate and verify production D1

# 仅显式触发；迁移和验证失败时不继续发布。 / Explicit dispatch only; migration or verification failure blocks rollout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-database
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Install Python for SQL invariants
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test local migration invariants
        # 发布迁移只运行SQL约束；Rust源码harness在CI native job执行。 / Migration runs SQL constraints; the Rust source harness runs in CI's native job.
        run: |
          python - <<'PY'
          import pathlib, unittest
          suite = unittest.TestSuite()
          for path in sorted(pathlib.Path("tests/database").glob("test_*.py")):
              if path.name != "test_scheduling_rust_reevaluate.py":
                  suite.addTests(unittest.defaultTestLoader.discover("tests/database", pattern=path.name))
          raise SystemExit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY
      - name: Record recovery bookmark before changes
        # 凭据仅授予实际Cloudflare调用，不暴露给依赖安装。 / Credentials are scoped to Cloudflare calls, not dependency installation.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 time-travel info moesegfault-status --json
      - name: Apply numbered migrations
        # 凭据仅授予实际Cloudflare调用，不暴露给依赖安装。 / Credentials are scoped to Cloudflare calls, not dependency installation.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply moesegfault-status --remote
      - name: Verify actual remote integrity and migration ledger
        # 凭据仅授予实际Cloudflare调用，不暴露给依赖安装。 / Credentials are scoped to Cloudflare calls, not dependency installation.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute moesegfault-status --remote --command 'PRAGMA foreign_key_check; PRAGMA quick_check; SELECT name FROM d1_migrations ORDER BY id;' --json > "$RUNNER_TEMP/d1-verification.json"
          node scripts/release/verify-d1.mjs "$RUNNER_TEMP/d1-verification.json"
          echo 'D1 migration ledger, foreign keys and integrity verified.' >> "$GITHUB_STEP_SUMMARY"
