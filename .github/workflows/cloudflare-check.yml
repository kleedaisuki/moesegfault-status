name: Check Cloudflare credential scope

# 只读诊断：不输出凭据，不修改云端资源。 / Read-only diagnostics: never print credentials or mutate cloud resources.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify secret routing and read-only API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN ?? '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID ?? '';
          const config = readFileSync('wrangler.jsonc', 'utf8');
          const configured = config.match(/"account_id"\s*:\s*"([a-f0-9]{32})"/)?.[1];
          const database = config.match(/"database_id"\s*:\s*"([a-f0-9-]+)"/)?.[1];
          const valid = token.length > 0 && token === token.trim() && account === configured;
          console.log(JSON.stringify({token_present: token.length > 0, token_has_no_outer_whitespace: token === token.trim(), account_matches_repository_config: account === configured}));
          if (!valid) process.exit(1);
          let failed = false;
          for (const [label, resource] of [
            ['worker_read', 'workers/workers/fd8e808de9c14c4db796da1980ce5392'],
            ['d1_list', 'd1/database'],
            ['d1_target_read', `d1/database/${database}`],
          ]) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${resource}`, {headers: {authorization: `Bearer ${token}`}, signal: AbortSignal.timeout(15000)});
            const result = await response.json();
            console.log(JSON.stringify({check: label, http_status: response.status, success: result.success === true, error_codes: (result.errors ?? []).map(error => error.code)}));
            failed ||= !response.ok || result.success !== true;
          }
          if (failed) process.exit(1);
          JS
