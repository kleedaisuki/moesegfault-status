name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  contracts:
    name: Contracts and OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Regenerate contracts without drift
        run: pnpm contracts:check
      - name: Lint OpenAPI 3.1.1
        run: pnpm openapi:lint
      - name: Enforce OpenAPI invariants
        run: pnpm exec tsx scripts/release/openapi-gate.ts packages/contracts/openapi.json
      - name: Compare pull request with its actual base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:packages/contracts/openapi.json" 2>/dev/null; then
            git show "origin/${BASE_REF}:packages/contracts/openapi.json" > "${RUNNER_TEMP}/openapi-base.json"
            pnpm exec tsx scripts/release/openapi-gate.ts packages/contracts/openapi.json "${RUNNER_TEMP}/openapi-base.json"
          else
            echo "::notice::Base revision has no OpenAPI artifact; this pull request establishes the compatibility baseline."
          fi

  runtime:
    name: Rust Workers, real workerd and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-rust-wasm
      - name: Install pinned Workers Rust build tool
        run: cargo install worker-build --version 0.8.5 --locked
      # 生产字节先构建后审核；Wrangler不包含build钩子。 / Build and review production bytes first; Wrangler has no build hook.
      - name: Build all Rust production Workers and debug artifacts
        run: pnpm build:backend
      # 普通原生测试跳过的真实产物审核必须在构建之后执行。 / Run real artifact audits that ordinary native tests skip after assembly.
      - name: Audit real release inventories and frozen deployment snapshots
        run: |
          cargo test --locked -p status-build -- --include-ignored
          cargo test --locked -p status-release -- --include-ignored
      - name: Build real Rust runtime acceptance driver
        run: pnpm build:rust-runtime
      - name: Check source formatting
        run: pnpm format:check
      - name: Type-check frontend and wire contracts only
        run: pnpm typecheck
      # TS只作为浏览器代码和测试驱动；业务执行路径是Rust/WASM。 / TypeScript is browser code and test drivers; business execution is Rust/WASM.
      - name: Run frontend, contracts and actual workerd acceptance tests
        run: pnpm test
      - name: Validate prebuilt status, gateway and regional Worker uploads offline
        run: pnpm deploy:check
      - name: Build operations UI
        run: pnpm build:frontend
  database:
    name: SQL schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test migrations and SQL invariants
        run: |
          python - <<'PY'
          import pathlib, unittest
          suite = unittest.TestSuite()
          for path in sorted(pathlib.Path("tests/database").glob("test_*.py")):
              if path.name != "test_scheduling_rust_reevaluate.py":
                  suite.addTests(unittest.defaultTestLoader.discover("tests/database", pattern=path.name))
          raise SystemExit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY
          python crates/status-backend/src/deployments/test_sql.py
          for file in crates/status-backend/src/admin/mutations/native/*.py; do python "$file"; done

  rust:
    name: Native Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for the native-source harness
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install stable Rust from rustup
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Check rustfmt
        run: cargo fmt --all -- --check
      - name: Reject Clippy warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run native tests
        run: cargo test --locked --workspace
      # 离线harness依赖上一步已缓存Cargo依赖，不依赖runner偶然预装环境。 / The offline harness uses Cargo dependencies cached by the preceding native tests.
      - name: Run native harness for Wasm-only reevaluation and lifecycle source
        run: python -m unittest discover -s tests/database -p test_scheduling_rust_reevaluate.py -v
      # 验证 Rust 平台代码，而非仅原生纯函数。 / Check Rust platform code, not just native pure functions.
      - name: Check Rust backend against Workers WASM target
        run: >-
          cargo clippy --locked -p status-backend -p status-worker -p admin-rpc-worker
          -p ops-gateway-worker -p probe-worker -p diagnostic-client --target wasm32-unknown-unknown -- -D warnings
