name: Setup JavaScript toolchain
description: 安装固定 Node/pnpm 并恢复只读依赖缓存 / Install pinned Node/pnpm and restore the dependency cache
runs:
  using: composite
  steps:
    # 供应链 action 固定到经上游 tag 核对的完整提交。 / Supply-chain actions are pinned to full commits verified against upstream tags.
    - name: Install pnpm 12.4.1
      uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      with:
        version: 12.4.1
        run_install: false
    - name: Install Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
