[package]
name = "status-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Rust application services for moeSegfault Workers"

[dependencies]
status-domain = { path = "../status-domain" }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
futures-util = "0.3"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
percent-encoding = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5", features = ["d1", "queue"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
worker-sys = { version = "=0.8.5", features = ["d1"] }
web-sys = { version = "0.3", features = ["ReadableStream", "ReadableStreamDefaultReader", "Request", "AbortSignal"] }
