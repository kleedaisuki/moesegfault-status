[package]
name = "status-backend"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust application services for moeSegfault Workers"

[dependencies]
status-domain = { path = "../status-domain" }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
futures-util = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5", features = ["d1", "queue"] }
