[package]
name = "status-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
dwarf-debug-info = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
status-backend = { path = "../status-backend" }
status-domain = { path = "../status-domain" }
worker = { version = "=0.8.5", features = ["d1", "queue"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
futures-util = "0.3"
