[package]
name = "diagnostic-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Bounded best-effort Rust Diagnostic producer SDK"

[dependencies]
status-domain = { path = "../status-domain" }
status-backend = { path = "../status-backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
regex = "1"
futures-util = "0.3"
thiserror = "2"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.5" }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"

[dev-dependencies]
futures-executor = "0.3"
