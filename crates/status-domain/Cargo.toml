[package]
name = "status-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
description = "Pure domain model and evaluator for moeSegFault Status"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
wasm-bindgen = { version = "=0.2.128", optional = true }

[dev-dependencies]
serde_json = "1"
